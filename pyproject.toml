[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evoaug"
version = "2.0.0"
description = "Evolution-inspired data augmentations for genomic sequence models (PyTorch DataLoader API)."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Peter K. Koo", email = "koo@cshl.edu"},
]
maintainers = [
    {name = "Peter K. Koo", email = "koo@cshl.edu"},
]
keywords = ["genomics", "data-augmentation", "deep-learning", "pytorch", "bioinformatics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "torch>=1.9.0",
    "lightning>=2.0.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "h5py>=3.1.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.3",
    "seaborn>=0.11",
    "jupyter>=1.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=1.0",
    "sphinx-autodoc-typehints>=1.0",
]
full = [
    "matplotlib>=3.3",
    "seaborn>=0.11",
    "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/p-koo/evoaug"
Documentation = "https://evoaug.readthedocs.io/"
Repository = "https://github.com/p-koo/evoaug"
Issues = "https://github.com/p-koo/evoaug/issues"

[tool.setuptools.packages.find]
include = ["evoaug*"]
